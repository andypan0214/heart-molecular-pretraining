# HEART FULL general molecular pretraining -- parameter record for scripts/pretrain_heart.sh.
#
# The SLURM script does NOT read this file (its parameter block is written out
# in the LUMI style); tests/test_scripts.py checks that both agree.
# batch-size is a placeholder: the script requires BATCH_SIZE explicitly,
# chosen from the VRAM probe (README_HEART.md, Stage D). 448 is LUMI's value on
# an A100, not a tested CMRI value.
#
# Never launched automatically. Submit only after the smoke test passed:
#   HEART_CONFIRM_FULL=1 BATCH_SIZE=<probed> HEART_SMOKE_RUN=<smoke run dir> \
#       sbatch --gres=gpu:<h200-type>:1 scripts/pretrain_heart.sh

launcher:
  run_name: heart-pretrain-full-v1
  script: scripts/pretrain_heart.sh
  data_path: /home/ypan/heart_liver/model_train/UniMolReference/ligand_data/ligands
  output_root: /home/ypan/heart_liver/model_train/heart-molecular-pretraining/runs
  n_gpu: 1                  # >1 uses torchrun (untested on CMRI)
  run_dir_mode: fixed       # runs/full/<run_name>; resubmission resumes
  stop_margin_minutes: 30
  min_gpu_mem_gb: 40
  min_free_gb: 50
  requires_confirmation: true
  slurm: {partition: gpu, gres: "gpu:1", cpus_per_task: 16, mem: 128G, time: "2-00:00:00", signal: "B:USR1@1800"}

unicore:
  task: unimol_contrastive
  loss: unimol_contrastive
  arch: unimol_contrastive_base
  train-subset: train
  valid-subset: valid
  dict-name: dict.txt
  mode: train
  num-workers: 15           # SLURM_CPUS_PER_TASK - 1
  data-buffer-size: 20
  ddp-backend: c10d
  encoder-attention-heads: 64
  max-atoms: 256
  # LUMI objectives and weights (unchanged)
  masked-token-loss: 1
  masked-coord-loss: 5
  masked-dist-loss: 10
  x-norm-loss: 0.01
  delta-pair-repr-norm-loss: 0.01
  contrastive-loss: 10.0
  contrastive-view-mode: independent
  mask-prob: 0.15
  only-polar: 0
  noise-type: uniform
  noise: 1.0
  # LUMI optimisation schedule
  optimizer: adam
  adam-betas: "(0.9, 0.99)"
  adam-eps: 1.0e-6
  clip-norm: 1.0
  weight-decay: 1.0e-4
  lr-scheduler: polynomial_decay
  lr: 1.0e-5
  warmup-updates: 10000
  total-num-update: 1000000
  max-update: 1000000
  update-freq: 1            # UPDATE_FREQ
  seed: 1
  batch-size: 448           # placeholder = LUMI A100 value; the script requires BATCH_SIZE
  batch-size-valid: 448
  fp16: true
  fp16-init-scale: 4
  fp16-scale-window: 256
  log-interval: 100
  log-format: simple
  validate-interval-updates: 10000
  max-valid-steps: null     # LUMI: validate on the whole valid.lmdb (98,844 molecules)
  save-interval-updates: 10000
  keep-interval-updates: 10 # + checkpoint_last.pt + checkpoint_best.pt
  no-epoch-checkpoints: true
