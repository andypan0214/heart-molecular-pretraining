# HEART 10-update GPU SMOKE TEST -- parameter record for scripts/pretrain_smoke.sh.
#
# The SLURM script does NOT read this file: its parameters are written out
# plainly in the LUMI style. This file is the machine-readable record of the
# same values. tests/test_scripts.py fails if the two ever disagree, and the
# notebook (Part E) builds its in-kernel forward/backward test from it.
#
# Submit (from .../heart-molecular-pretraining/model/pretrain):
#   sbatch scripts/pretrain_smoke.sh
#
# Ten optimizer updates on real data prove that the pipeline runs; they do NOT
# pretrain the model. Architecture and loss weights follow LUMI-lab
# model/pretrain/pretrain.sh; only batch size, step counts, intervals,
# workers and checkpoint retention are reduced.

launcher:
  run_name: heart-smoke-test
  script: scripts/pretrain_smoke.sh
  # Read-only Uni-Mol ligand data (train.lmdb, valid.lmdb, dict.txt) = $BASE/UniMolReference/ligand_data/ligands
  data_path: /home/ypan/heart_liver/model_train/UniMolReference/ligand_data/ligands
  # git-ignored; the script writes runs/smoke/<run_name>-<date>-j<jobid>/
  output_root: /home/ypan/heart_liver/model_train/heart-molecular-pretraining/runs
  n_gpu: 1
  run_dir_mode: timestamped
  stop_margin_minutes: 5
  requires_confirmation: false
  slurm: {partition: gpu, gres: "gpu:1", cpus_per_task: 6, mem: 55G, time: "00:30:00"}

unicore:
  # --- task / model / loss registered by ./unimol (LUMI names, unchanged) ---
  task: unimol_contrastive
  loss: unimol_contrastive
  arch: unimol_contrastive_base
  train-subset: train
  valid-subset: valid
  dict-name: dict.txt
  mode: train
  # --- data loading ---
  num-workers: 5            # 6 CPUs allocated: 5 loader workers + main process
  data-buffer-size: 10
  ddp-backend: c10d
  # --- architecture: LUMI base (15 layers, 512 dim, 2048 FFN) with 64 heads ---
  encoder-attention-heads: 64
  max-atoms: 256
  # --- LUMI self-supervised objectives ---
  masked-token-loss: 1
  masked-coord-loss: 5
  masked-dist-loss: 10
  x-norm-loss: 0.01
  delta-pair-repr-norm-loss: 0.01
  contrastive-loss: 10.0
  contrastive-view-mode: independent   # HEART patch P3; 'identical' = stock LUMI behaviour
  mask-prob: 0.15
  only-polar: 0             # 0 = remove all hydrogens (Uni-Mol/LUMI pretraining setting)
  noise-type: uniform
  noise: 1.0
  # --- optimisation (LUMI values except schedule length) ---
  optimizer: adam
  adam-betas: "(0.9, 0.99)"
  adam-eps: 1.0e-6
  clip-norm: 1.0
  weight-decay: 1.0e-4
  lr-scheduler: polynomial_decay
  lr: 1.0e-5
  warmup-updates: 3
  total-num-update: 20      # > max-update so a resume test (to 12) still has lr > 0
  update-freq: 1
  seed: 1
  batch-size: 4             # molecules per GPU; each contributes 2 views -> 8 sequences
  batch-size-valid: 4
  max-update: 10            # 10 genuine optimizer updates (fp16 overflow steps are not counted)
  # --- precision: fp16 on T4 (sm_75); bf16 is not native on T4 ---
  fp16: true
  fp16-init-scale: 4
  fp16-scale-window: 256
  # --- logging / validation / checkpoints ---
  log-interval: 1
  log-format: simple
  validate-interval-updates: 5
  max-valid-steps: 5
  save-interval-updates: 5
  keep-interval-updates: 1
  no-epoch-checkpoints: true
